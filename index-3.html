<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Classic Music Trivia Challenge</title><style>body{font-family:system-ui,Arial;background:#10162a;color:#fff;margin:0;padding:22px}main{max-width:650px;margin:auto}.card{background:#202a43;border-radius:20px;padding:25px;margin-top:20px}h1{color:#ffd66e}button{display:block;width:100%;padding:15px;margin:10px 0;border:1px solid #66728f;border-radius:12px;background:#303c58;color:white;font-size:17px;text-align:left;cursor:pointer}button:disabled{opacity:.7;cursor:default}.correct{background:#216a51}.wrong{background:#813c4a}.primary{background:#f2c35d;color:#171b28;text-align:center;font-weight:700}#feedback{line-height:1.6}small{color:#b6c4e1}#share{display:none}</style></head><body><main><h1>🎵 Classic Music Trivia Challenge</h1><p>Golden hits from the '60s, '70s, '80s and '90s • Musika Natin (Noon at Ngayon)</p><div class="card"><small id="progress">Ready to play?</small><h2 id="question">Can you score 10 out of 10?</h2><div id="answers"></div><p id="feedback" aria-live="polite"></p><button id="next" class="primary">Start the quiz ▶</button><button id="share" class="primary">Share my score</button></div><p><small>No sign-in required. Scores stay on your device unless you choose to share them.</small></p></main><script>const data=[['Who originally released “Hotel California” in 1976?',['America','Eagles','Chicago','Fleetwood Mac'],1,'Eagles released the song on their 1976 album Hotel California.'],['Who sang the 1984 hit “Hello”?',['Phil Collins','Lionel Richie','George Michael','Michael Bolton'],1,'Lionel Richie released Hello in 1984.'],['Which band recorded “You’re the Inspiration”?',['Chicago','Journey','Toto','Foreigner'],0,'Chicago released the song in 1984.'],['Who recorded “I’d Really Love to See You Tonight”?',['Seals and Crofts','Hall and Oates','Simon and Garfunkel','England Dan and John Ford Coley'],3,'England Dan and John Ford Coley released it in 1976.'],['Which duo recorded “All Out of Love”?',['Air Supply','The Carpenters','Bread','Bee Gees'],0,'Air Supply released All Out of Love in 1980.'],['Who sang on Deep Purple’s original “Smoke on the Water”?',['David Coverdale','Glenn Hughes','Joe Lynn Turner','Ian Gillan'],3,'Ian Gillan sang on the original 1972 recording.'],['In what year was Phil Collins’ “Against All Odds” released?',['1981','1982','1984','1987'],2,'Against All Odds was released in 1984.'],['Which band released “Beauty and Madness”?',['A-ha','Tears for Fears','The Human League','Fra Lippo Lippi'],3,'Fra Lippo Lippi released Beauty and Madness in 1987.'],['Who recorded “Annie’s Song”?',['Jim Croce','James Taylor','John Denver','Dan Fogelberg'],2,'John Denver released Annie’s Song in 1974.'],['Which group recorded “How Deep Is Your Love” in 1977?',['Bee Gees','ABBA','Bread','The Carpenters'],0,'Bee Gees recorded it for Saturday Night Fever.']];let index=-1,score=0,locked=false;const q=document.querySelector('#question'),a=document.querySelector('#answers'),f=document.querySelector('#feedback'),p=document.querySelector('#progress'),n=document.querySelector('#next'),s=document.querySelector('#share');function render(){locked=false;f.textContent='';n.style.display='none';s.style.display='none';a.innerHTML='';if(index>=data.length){p.textContent='Challenge completed!';q.textContent=`🎉 Your score: ${score} / ${data.length}`;f.textContent=score===10?'Perfect score! You are a classic music legend!':'Thanks for playing! Share your score and challenge your friends.';n.textContent='Play again ↻';n.style.display='block';s.style.display='block';return}p.textContent=`Question ${index+1} of ${data.length} • Score ${score}`;q.textContent=data[index][0];data[index][1].forEach((label,j)=>{const b=document.createElement('button');b.textContent=String.fromCharCode(65+j)+'. '+label;b.addEventListener('click',()=>{if(locked)return;locked=true;const good=j===data[index][2];if(good)score++;[...a.children].forEach((x,k)=>{x.disabled=true;if(k===data[index][2])x.classList.add('correct');else if(k===j)x.classList.add('wrong')});f.textContent=(good?'✅ Correct! ':'❌ Not quite. ')+data[index][3];n.textContent=index===data.length-1?'See my score →':'Next question →';n.style.display='block'});a.appendChild(b)})}n.addEventListener('click',()=>{if(index>=data.length){index=0;score=0}else index++;render()});s.addEventListener('click',async()=>{const message=`🎵 I scored ${score}/10 on the Classic Music Trivia Challenge! Can you beat me? ${location.href}`;if(navigator.share){try{await navigator.share({title:'Classic Music Trivia Challenge',text:message,url:location.href})}catch(e){}}else{window.prompt('Copy this message to share on Facebook:',message)}});</script></body></html>
